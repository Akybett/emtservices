openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact form
  - name: reviews
    description: Google Reviews
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit contact enquiry
      description: Sends an enquiry email to the EMT Services team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reviews:
    get:
      operationId: getReviews
      tags: [reviews]
      summary: Get Google Reviews
      description: Returns cached reviews from the Google Places API
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewsResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        eventDate:
          type: string
        eventLocation:
          type: string
          minLength: 2
        servicesRequired:
          type: string
          minLength: 10
        recaptchaToken:
          type: string
          description: Google reCAPTCHA v3 token, verified server-side when configured
      required:
        - fullName
        - email
        - eventDate
        - eventLocation
        - servicesRequired
    ContactResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    GoogleReview:
      type: object
      properties:
        authorName:
          type: string
        rating:
          type: number
        text:
          type: string
        relativePublishTimeDescription:
          type: string
      required:
        - authorName
        - rating
    ReviewsResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/GoogleReview"
        rating:
          type: number
        userRatingCount:
          type: integer
      required:
        - reviews
